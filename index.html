<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast | Weather Forecast App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ["Poppins", "ui-sans-serif", "system-ui"]
                    },
                    boxShadow: {
                        glow: "0 0 30px rgba(34, 211, 238, 0.35)"
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="./style.css">
</head>
<body id="appBody" class="min-h-screen bg-slate-950 text-slate-100 transition-all duration-500">
    <main class="relative mx-auto min-h-screen w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="aurora-effect"></div>

        <header class="mb-8 flex flex-col gap-4 rounded-2xl border border-white/10 bg-white/5 p-5 backdrop-blur md:flex-row md:items-center md:justify-between">
            <div>
                <p class="text-cyan-300">Weather Forecast Application</p>
                <h1 class="font-display text-3xl font-semibold tracking-tight">SkyCast Dashboard</h1>
                <p class="mt-1 text-sm text-slate-300">Live weather insights with location search and 5-day outlook.</p>
            </div>
            <div class="inline-flex items-center gap-2 rounded-xl border border-white/15 bg-slate-900/60 p-1">
                <button id="celsiusBtn" class="temp-unit-btn active px-4 py-2 text-sm font-medium">°C</button>
                <button id="fahrenheitBtn" class="temp-unit-btn px-4 py-2 text-sm font-medium">°F</button>
            </div>
        </header>

        <section class="grid gap-6 lg:grid-cols-[1.1fr_1.9fr]">
            <aside class="space-y-4 rounded-2xl border border-white/10 bg-white/5 p-5 backdrop-blur">
                <form id="searchForm" class="space-y-3" novalidate>
                    <label for="cityInput" class="text-sm font-medium text-slate-200">Search by city</label>
                    <div class="relative flex gap-2">
                        <input id="cityInput" type="text" autocomplete="off" placeholder="e.g. Delhi" class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-2.5 text-slate-100 outline-none ring-cyan-300 transition-all duration-300 focus:ring-2 focus:scale-[1.02] focus:bg-slate-900/90">
                        <ul id="citySuggestions" class="city-suggestions hidden" role="listbox" aria-label="City suggestions"></ul>
                        <button type="submit" class="rounded-xl bg-cyan-400 px-4 py-2.5 font-medium text-slate-900 transition hover:bg-cyan-300">Search</button>
                    </div>
                </form>

                <button id="currentLocationBtn" class="w-full rounded-xl border border-cyan-300/50 bg-cyan-400/10 px-4 py-2.5 text-sm font-medium text-cyan-200 transition hover:bg-cyan-400/20">
                    Use Current Location
                </button>

                <div id="recentWrapper" class="hidden">
                    <label for="recentCities" class="mb-2 block text-sm font-medium text-slate-200">Recent searches</label>
                    <select id="recentCities" class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-2.5 text-slate-100 outline-none ring-cyan-300 transition focus:ring-2">
                        <option value="">Select a recent city</option>
                    </select>
                </div>

                <div id="customAlert" class="hidden rounded-xl border border-rose-300/40 bg-rose-400/15 px-4 py-3 text-sm text-rose-100"></div>
                <div id="statusMessage" class="hidden rounded-xl border border-amber-300/40 bg-amber-300/15 px-4 py-3 text-sm text-amber-100"></div>
            </aside>

            <section class="space-y-6">
                <article class="rounded-2xl border border-white/10 bg-white/5 p-6 shadow-glow backdrop-blur">
                    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h2 id="locationName" class="font-display text-2xl font-semibold">Search a city to begin</h2>
                            <p id="currentDate" class="text-sm text-slate-300">--</p>
                        </div>
                        <div id="weatherIcon" class="text-5xl" aria-label="Weather icon">🌤️</div>
                    </div>

                    <div class="grid gap-3 sm:grid-cols-3">
                        <div class="metric-card">
                            <p class="metric-label">Today's Temp</p>
                            <p id="temperatureValue" class="metric-value">--</p>
                        </div>
                        <div class="metric-card">
                            <p class="metric-label">Humidity</p>
                            <p id="humidityValue" class="metric-value">--</p>
                        </div>
                        <div class="metric-card">
                            <p class="metric-label">Wind Speed</p>
                            <p id="windValue" class="metric-value">--</p>
                        </div>
                    </div>
                </article>

                <article class="rounded-2xl border border-white/10 bg-white/5 p-6 backdrop-blur">
                    <h3 class="mb-4 font-display text-xl font-semibold">5-Day Forecast</h3>
                    <div id="forecastGrid" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5"></div>
                </article>
            </section>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
